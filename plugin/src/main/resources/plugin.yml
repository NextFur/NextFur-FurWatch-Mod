name: FurWatch
version: '1.0.0-SNAPSHOT'
main: net.nextfur.fws.FwMain
api-version: '1.21'
load: STARTUP
authors: [ KivixEletric, Diogo06221 ]
website: https://fursmp.com/

commands:
  lobby:
    description: Teleports the player to the lobby.
    usage: /<command>
    permission: fws.command.lobby
  build:
    description: Toggles build mode for the player.
    usage: /<command>
    permission: fws.command.build